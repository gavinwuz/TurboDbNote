[package]
name = "turbodbnote"
default-run = "turbodbnote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
markdown = "=1.0.0"
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
turbodbn-core.workspace = true
turbodbn-services.workspace = true
turbodbn-diagnostics = { path = "../diagnostics" }
async-channel = "2"
anyhow = "1"
lsp-types = "=0.97.0"
tree-sitter-sequel = "=0.3.8"
tree-sitter-language = "=0.1.8"
serde.workspace = true
serde_json.workspace = true
dirs = "6"
tempfile = "3"
uuid.workspace = true

rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = "0.4"

[build-dependencies]
cc = "=1.2.67"
embed-resource = "=3.0.11"
serde.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
