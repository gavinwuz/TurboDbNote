name: Release Windows and Linux
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already prepared in Cargo and both changelogs (x.y.z)'
        required: true
        type: string
      publish:
        description: 'Publish after both platforms pass'
        type: boolean
        default: false
      replace_existing:
        description: 'Explicitly delete an existing release and its tag after replacement packages pass'
        type: boolean
        default: false
  push:
    branches: ["**"]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && !startsWith(github.ref, 'refs/tags/v') }}
jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[package]'))
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - run: cargo test --locked -j 1 -p turbodbnote-tools
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(cargo run --quiet --locked -j 1 -p turbodbnote-tools -- version)
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$version" ]; then exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "${GITHUB_REF#refs/tags/}" != "v$version" ]; then exit 1; fi
          cargo run --quiet --locked -j 1 -p turbodbnote-tools -- release --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  windows:
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
          cache-targets: 'true'
          cache-all-crates: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: target/tools/mysql-bundle
          key: mysql-5.1.73-winx64-verified-v1
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and package
        shell: pwsh
        run: |
          cargo run --quiet --locked -j 1 -p turbodbnote-tools -- run-cargo test --locked -j 1 -p turbodbnote --bin turbodbnote -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            ./scripts/package-windows.ps1 -IsccPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          } catch {
            $details = $_.Exception.Message -replace '(?i)(password|secret|token|api[_-]?key|authorization).*', '[sensitive detail omitted]'
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows packaging::$details"
            throw
          }
      - name: Verify isolated driver contracts
        run: cargo run --locked -j 1 -p turbodbnote-driver-host --example verify_contracts -- dist/TurboDBNote-v${{ needs.metadata.outputs.version }}-windows-x64/drivers/native
      - name: Open the packaged Windows window in isolation
        run: python scripts/verify-windows-startup.py dist/TurboDBNote-v${{ needs.metadata.outputs.version }}-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
            dist/*-sources.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-symbols
          path: dist/*-symbols/*
          if-no-files-found: error
          retention-days: 90
  linux:
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native build and X11 verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libasound2-dev libfontconfig1-dev libglib2.0-dev libssl-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libvulkan-dev libzstd-dev libsqlite3-dev unixodbc-dev mesa-vulkan-drivers xvfb x11-utils
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux
          cache-targets: 'true'
          cache-all-crates: 'true'
      - name: Verify Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo run --quiet --locked -j 1 -p turbodbnote-tools -- run-cargo check --locked -j 1 --workspace --all-targets
          cargo run --quiet --locked -j 1 -p turbodbnote-tools -- run-cargo test --locked -j 1 --workspace -- --test-threads=1
          cargo run --quiet --locked -j 1 -p turbodbnote-tools -- run-cargo clippy --locked -j 1 --workspace --all-targets -- -D warnings
      - name: Build archive
        run: cargo run --quiet --locked -j 1 -p turbodbnote-tools -- package-linux
      - name: Verify isolated driver contracts
        run: cargo run --locked -j 1 -p turbodbnote-driver-host --example verify_contracts -- dist/TurboDBNote-v${{ needs.metadata.outputs.version }}-linux-x64/drivers/native
      - name: Open the packaged window in isolated X11
        run: xvfb-run -a python3 scripts/verify-linux-startup.py dist/TurboDBNote-v${{ needs.metadata.outputs.version }}-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error
  publish:
    needs: [metadata, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: candidate/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: candidate/linux
      - name: Check packages and publish the immutable version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REPLACE_EXISTING: ${{ inputs.replace_existing || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && contains(github.event.head_commit.message, '[replace-release]')) }}
        run: |
          cargo run --quiet --locked -j 1 -p turbodbnote-tools -- release --version "$VERSION" --publication --notes release-notes.md
          cd candidate/windows
          sha256sum --check SHA256SUMS.txt
          cd ../linux
          sha256sum --check SHA256SUMS-linux.txt
          cd ../..
          mkdir upload
          cp candidate/windows/*-portable.zip candidate/windows/*-setup.exe candidate/windows/*-sources.zip candidate/linux/*.tar.gz upload/
          cd upload
          sha256sum *.zip *.exe *.tar.gz > SHA256SUMS.txt
          cd ..
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "$REPLACE_EXISTING" != 'true' ]; then
              echo 'This version already has a release; refusing to overwrite it.'
              exit 1
            fi
            gh release delete "v$VERSION" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" upload/* --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md --latest
