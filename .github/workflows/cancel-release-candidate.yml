name: Cancel superseded release candidate
on:
  push:
    branches: ["feat/layout-202610"]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    if: contains(github.event.head_commit.message, '[cancel-candidate]')
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel the unpublished candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/39883233917/cancel"
