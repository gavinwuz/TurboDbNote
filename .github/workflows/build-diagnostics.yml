name: Read failed build diagnostics
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Failed job ID in this repository'
        required: true
        type: string
  push:
    branches: ['**']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose]')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Read redacted failure details
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: cargo run --quiet --locked -j 1 -p turbodbnote-tools -- build-diagnostics
