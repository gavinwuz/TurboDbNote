[package]
name = "turbodbn-services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
turbodbn-core.workspace = true
uuid.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-channel = "2"
dunce = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["mysql", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring"] }
tempfile = "3"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
futures-util = "0.3"
encoding_rs = "0.8"
redis = { version = "=0.32.7", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "tls-rustls-insecure"] }
rustls = { version = "0.23", default-features = false }
tokio = { version = "=1.48.0", features = ["rt", "process", "io-util", "time", "sync", "macros"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }
